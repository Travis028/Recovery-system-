<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Report lost identity documents, register found ones and collect them safely at verified pickup points." />
    <!-- CSP -->
    <title>LDRS · Lost Documents Recovery System</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Sets the theme class before the first paint so a dark-mode reload does not flash white. -->
    <script id="theme-init">
      (function () {
        try {
          var stored = localStorage.getItem('ldrs.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
