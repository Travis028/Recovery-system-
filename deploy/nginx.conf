# Example Nginx site for the built LDRS front end (npm run build -> dist/).
# HTTPS only, single-page-app routing, security headers and caching.
server {
    listen 80;
    server_name ldrs.example.go.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ldrs.example.go.ke;

    ssl_certificate     /etc/letsencrypt/live/ldrs.example.go.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldrs.example.go.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ldrs/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # The page itself is never cached, so a new release is picked up straight away.
    location / {
        include /etc/nginx/snippets/ldrs-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Built files have a content hash in their name and can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/ldrs-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
