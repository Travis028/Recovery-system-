# Example Nginx site for the built LDRS front end (npm run build -> dist/).
# HTTPS only, single-page-app routing, and security headers.
server {
    listen 80;
    server_name ldrs.example.go.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ldrs.example.go.ke;

    ssl_certificate     /etc/letsencrypt/live/ldrs.example.go.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldrs.example.go.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ldrs/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
