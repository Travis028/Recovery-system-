<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Report lost identity documents, register found ones and collect them safely at verified pickup points." />
    <!-- Progressive Web App (PWA) & Mobile Meta -->
    <meta name="application-name" content="LDRS Kenya" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LDRS Kenya" />
    <meta name="theme-color" content="#0c6378" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071926" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- CSP -->
    <title>LDRS · Lost Documents Recovery System</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Sets the theme class before the first paint so a dark-mode reload does not flash white. -->
    <script id="theme-init">
      (function () {
        try {
          var stored = localStorage.getItem('ldrs.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
